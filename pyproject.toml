[project]
name = "quote-desk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Talel Ben Mabrouk" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.54.0",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
quote-desk = "quote_desk:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
